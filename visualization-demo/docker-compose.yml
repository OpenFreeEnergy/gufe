name: gufe-viz

# Two self-contained demos of the gufe framejs visualization. Plain Docker
# Compose — no `just`, nothing installed on the host but Docker:
#
#   docker compose up notebook      → Demo 1: .view() in JupyterLab  (http://localhost:8888/lab)
#   docker compose up openfe-view   → Demo 2: `openfe view` server    (http://localhost:8899)
#
# Both build the same fast native-arm64 gufe image and editable-install the
# checkout one level up, so host edits to `src/gufe/` (including the frame,
# `viz_assets/gufe/code.js`) are live — restart the kernel / the service.
x-gufe: &gufe
  build:
    # Context is the gufe repo root (one level up): the build needs environment.yml,
    # which lives there, not in this subdir.
    context: ..
    dockerfile: visualization-demo/Dockerfile
    args:
      CONDA_ENV_FILE: environment.yml
  image: gufe-viz:local
  environment:
    - SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+docker
  volumes:
    # The gufe checkout (repo root), editable-installed over the env. Mounted at
    # /src so its `gufe` dir name doesn't shadow the installed package (src layout).
    - ..:/src/gufe
    - ./demo:/workspace/demo
    - ./scratch:/workspace/scratch

services:
  # ── Demo 1 — the NOTEBOOK implementation ──────────────────────────────────
  # `.view()` and bare-cell rendering of gufe objects. Open demo/framejs_demo.ipynb;
  # it builds one of every visualizable gufe type from the bundled test data and
  # renders each. Self-contained — no openfe, no external data.
  notebook:
    <<: *gufe
    container_name: gufe-viz-notebook
    command:
      - dev-start.sh
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/workspace
      - --ServerApp.token=
      - --ServerApp.password=
    ports:
      - "8888:8888"

  # ── Demo 2 — the `openfe view` implementation ─────────────────────────────
  # The local viz server: this is exactly what `openfe view <file>` runs (the
  # openfe CLI command is a thin wrapper around gufe.visualization.server). It
  # serves a browsable listing of gufe's test fixtures at http://localhost:8899;
  # click any file to see its visualization.
  #
  #  --proxy re-hosts framejs.io on this origin so the frame and the data share
  #          an origin — required for Chrome (Local Network Access), harmless in
  #          Firefox. See ../src/gufe/visualization/README.md.
  #  --host 0.0.0.0 : reachable through the published port from the host.
  #  --no-browser   : there is no browser inside the container; open the URL yourself.
  #
  # Point it at one file (or your own directory) with VIZ_TARGET:
  #   VIZ_TARGET=/src/gufe/src/gufe/tests/data/181l.pdb docker compose up openfe-view
  openfe-view:
    <<: *gufe
    container_name: gufe-viz-openfe-view
    command:
      - dev-start.sh
      - python
      - -m
      - gufe.visualization.server
      - --host=0.0.0.0
      - --port=8899
      - --no-browser
      - --proxy
      - ${VIZ_TARGET:-/src/gufe/src/gufe/tests/data}
    ports:
      - "8899:8899"

  # ── Optional — the same .view() rendering in marimo ───────────────────────
  # marimo renders anywidgets natively (where legacy py3Dmol output breaks).
  #   docker compose --profile marimo up marimo   → http://localhost:2718
  marimo:
    <<: *gufe
    profiles: ["marimo"]
    container_name: gufe-viz-marimo
    command:
      - dev-start.sh
      - marimo
      - edit
      - demo/marimo_demo.py
      - --host=0.0.0.0
      - -p
      - "2718"
      - --headless
      - --no-token
    ports:
      - "2718:2718"
