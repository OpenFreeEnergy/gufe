# Override: develop metaframe-widget in-place alongside gufe.
#
# Layer this on top of docker-compose.yml to mount your local metaframe-widget
# (the framejs.io widget) checkout over the PyPI build baked into the image;
# dev-start.sh editable-installs it, so host edits are live (restart the kernel —
# no rebuild). The package lives at <repo>/python.
#
# FRAMEJS_IO_REPO must point at your metaframe-js checkout root:
#   FRAMEJS_IO_REPO=~/dev/git/.../metaframe-js \
#     docker compose -f docker-compose.yml -f docker-compose.widget.yml up notebook
services:
  notebook:
    volumes:
      - ${FRAMEJS_IO_REPO:?set FRAMEJS_IO_REPO to your metaframe-js checkout root}/python:/src/metaframe-widget
  marimo:
    volumes:
      - ${FRAMEJS_IO_REPO:?set FRAMEJS_IO_REPO to your metaframe-js checkout root}/python:/src/metaframe-widget
