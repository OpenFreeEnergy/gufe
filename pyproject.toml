[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "gufe"
description = ""
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = [ "version" ]
urls = { Homepage = "https://github.com/OpenFreeEnergy/gufe" }
[[project.authors]]
name = "The OpenFE developers"
email = "openfe@omsf.io"

[tool.setuptools]
include-package-data = true
zip-safe = false
[tool.setuptools.packages]
find.where = [ "src" ]
find.namespaces = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pixi]
workspace.channels = [ "conda-forge" ]
workspace.platforms = [ "osx-arm64" ]
pypi-dependencies.gufe = { path = ".", editable = true }
tasks = {}

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [ "src/gufe/vendor/*" ]
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
  "F",  # Pyflakes
  "I",  # isort
  # "E", # pycodestyle errors
  # "C901"  # mccabe complexity  TODO: add this back in
  "UP",
  "W",  # pycodestyle warnings
]
ignore = [
  "E402", # module-level import not at top (conflicts w/ isort)
  "E722", # bare excepts (TODO: we should fix these in a follow-up PR)
  "E731", # lambda expressions (TODO: we should fix these)
  "F403", # undefined name (TODO: fix these)
  "F405", # undefined imports (TODO: fix these)
  "F841", # vars assigned but not used (TODO: fix these)
]
# ignore "unused import" error for all __init__.py files
per-file-ignores."__init__.py" = [ "F401" ]
isort.known-first-party = [ "gufe" ]

[tool.interrogate]
fail-under = 0
ignore-regex = [ ".*BaseClass.*", "^get$", "^mock_.*" ]
exclude = [ "build", "docs" ]
color = true
# possible values for verbose: 0 (minimal output), 1 (-v), 2 (-vv)
verbose = 2

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
files = "src/"
ignore_missing_imports = true
overrides = [
  { module = "gufe.vendor.*", ignore_errors = true },
  # TODO: troubleshoot these missing imports, add tests
  { module = "rdkit.*", follow_imports = "skip", follow_imports_for_stubs = true }
]

[tool.coverage]
[tool.coverage.run]
omit = [
  "src/*/_version.py",
  "src/*/tests/dev/*py",
  "src/gufe/tests/*",
  "src/gufe/vendor/*",
]
[tool.coverage.report]
exclude_lines = [
  "-no-cov",
  "\\.\\.\\.",
  "pragma: no cover",
  "pragma: no-cover",
  "raise NotImplementedError",
]
